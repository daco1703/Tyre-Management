services:
  - type: web
    name: tyresaathi
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm test && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/tyresaathi.sqlite
      - key: FLEET_SETUP_KEY
        generateValue: true
    disk:
      name: fleet-data
      mountPath: /var/data
      sizeGB: 1
