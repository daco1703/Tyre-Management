name: Build signed iOS IPA manually

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Profile type (registered devices required)
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - debugging

permissions:
  contents: read

jobs:
  signed-device:
    name: Signed IPA for provisioned devices
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    environment: ios-signing
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:versions
      - run: npm run ios:sync
      - name: Archive and export IPA (no publication)
        run: node scripts/ios-signing.js
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      - uses: actions/upload-artifact@v6
        with:
          name: signed-iOS-IPA-for-provisioned-devices
          path: artifacts/ios-device/export/*.ipa
          if-no-files-found: error
          retention-days: 7
